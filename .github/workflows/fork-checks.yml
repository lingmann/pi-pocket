name: Fork checks

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, edited]
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    fork-checks:
        name: Fork checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            PI_POCKET_BROWSER: /usr/bin/google-chrome
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
            - name: Check PR title
              if: github.event_name == 'pull_request'
              run: node scripts/victor/check-pr-title.mjs
            - name: Verify Chrome is available
              run: '"$PI_POCKET_BROWSER" --version'
            - uses: extractions/setup-just@v3
            - run: npm ci
            - run: node scripts/victor/fork.mjs check
